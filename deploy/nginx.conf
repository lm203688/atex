# 真测 Realcast 生产 Nginx 配置
# 前端为单文件 SPA（app/static/index.html），**必须由后端 FastAPI 渲染下发**：
# 后端 _render_index() 会为 <script> / <style> 注入一次性 nonce，并下发
# 对应的 Content-Security-Policy。v0.7.1 起 script-src、v0.7.5 起 style-src
# 均已去掉 'unsafe-inline'，改为 nonce 白名单。
#
# ⚠️ 切勿在此用 nginx 静态托管 index.html 或下发 CSP：
#    (1) 静态文件没有 nonce，配合 nginx 的 static CSP（含 unsafe-inline）
#        会让页面「能跑但零 XSS 防护」，后端 nonce 加固被完全绕过；
#    (2) nginx 静态 CSP 与后端 CSP 同时下发时浏览器取交集，行为难以预测。
#    CSP 的唯一正确来源是应用层（每请求动态生成 nonce），nginx 只做代理。
# /api、/ws、/docs 反向代理到后端 uvicorn（默认 app:8000）。
# 部署前请把证书放入 ./certs/fullchain.pem 与 ./certs/privkey.pem

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 网关层限流（与后端轻量限流互补，提供全局口径）----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=60r/s;

    upstream realcast_app {
        server app:8000;
        keepalive 32;
    }

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP → HTTPS 强制跳转（证书就绪后启用）
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 通用安全头（CSP 不下发，由应用层随 nonce 一起下发，见文件头说明）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # ---- WebSocket 实时概率推送 ----
        location /ws {
            limit_req zone=global_limit burst=20 nodelay;
            proxy_pass http://realcast_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # ---- API 反向代理 ----
        location /api {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://realcast_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 1m;
        }

        # ---- 交互式文档（生产可按需注释关闭）----
        location ~ ^/(docs|openapi.json) {
            proxy_pass http://realcast_app;
            proxy_set_header Host $host;
        }

        # ---- SPA 页面兜底：一切未匹配路径交给后端渲染 ----
        # 后端返回带 nonce 的 index.html 并下发 CSP；nginx 不做静态托管。
        location / {
            limit_req zone=global_limit burst=20 nodelay;
            proxy_pass http://realcast_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
