# 真测 Realcast 生产 Nginx 配置
# 前端为单文件 SPA（app/static/index.html），由本机静态托管；
# /api、/ws、/docs 反向代理到后端 uvicorn（默认 app:8000）。
# 部署前请把证书放入 ./certs/fullchain.pem 与 ./certs/privkey.pem

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 网关层限流（与后端轻量限流互补，提供全局口径）----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=60r/s;

    upstream realcast_app {
        server app:8000;
        keepalive 32;
    }

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP → HTTPS 强制跳转（证书就绪后启用）
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 通用安全头（CSP 仅在静态页下发，避免与后端重复下发导致 AND 叠加）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # ---- 静态 SPA（含 CSP）----
        root /usr/share/nginx/html;
        location = / {
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss:; frame-ancestors 'none'" always;
            try_files /index.html =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss:; frame-ancestors 'none'" always;
        }
        location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
        }

        # ---- WebSocket 实时概率推送 ----
        location /ws {
            limit_req zone=global_limit burst=20 nodelay;
            proxy_pass http://realcast_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # ---- API 反向代理 ----
        location /api {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://realcast_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 1m;
        }

        # ---- 交互式文档（生产可按需注释关闭）----
        location ~ ^/(docs|openapi.json) {
            proxy_pass http://realcast_app;
            proxy_set_header Host $host;
        }
    }
}
